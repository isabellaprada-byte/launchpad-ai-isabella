apiVersion: apps/v1
kind: Deployment
metadata:
  name: census-frontend
  namespace: census-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: census-frontend
  template:
    metadata:
      labels:
        app: census-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_ECR_ACCOUNT.dkr.ecr.us-east-1.amazonaws.com/census-portal/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_BACKEND_URL
              value: "https://api-census.forusall.com"
          livenessProbe:
            httpGet:
              path: /upload
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
