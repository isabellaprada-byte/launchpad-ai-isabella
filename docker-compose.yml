services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file: .env.local
    environment:
      PORT: "4000"
      FRONTEND_URL: "http://census-upload.forusall"
      NOTIFICATION_EMAIL: "isabella.prada@forusall.com"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:4000"
    ports:
      - "80:3000"
    env_file: .env.local
    environment:
      BACKEND_INTERNAL_URL: "http://backend:4000"
    depends_on:
      backend:
        condition: service_healthy
