version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - FRONTEND_URL=http://localhost:3000
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL}
      - DEVREV_TOKEN=${DEVREV_TOKEN}
      - DEVREV_PART_ID=${DEVREV_PART_ID}
      - SHAREFILE_CLIENT_ID=${SHAREFILE_CLIENT_ID}
      - SHAREFILE_CLIENT_SECRET=${SHAREFILE_CLIENT_SECRET}
      - SHAREFILE_USERNAME=${SHAREFILE_USERNAME}
      - SHAREFILE_PASSWORD=${SHAREFILE_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
    depends_on:
      backend:
        condition: service_healthy
